services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcmagus-web
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: pcmagus-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: