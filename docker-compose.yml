services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcmagus-web
    restart: unless-stopped
    expose:
      - "3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pcmagus-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - web